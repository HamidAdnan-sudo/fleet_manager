name: fleet_manager
description: "A truck fleet management app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.4
  google_fonts: ^6.3.2
  flutter_animate: ^4.5.2
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^5.0.2
  geolocator: ^14.0.0
  permission_handler: ^13.0.0
  google_maps_flutter: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env